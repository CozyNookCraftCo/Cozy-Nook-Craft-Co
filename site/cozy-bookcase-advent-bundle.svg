<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Illustration of a little wooden bookcase filled with wrapped books">
  <rect width="600" height="600" fill="#FBF3EE"/>
  <circle cx="300" cy="300" r="250" fill="#F8D9DE" opacity=".45"/>
  <!-- bookcase frame -->
  <rect x="150" y="90" width="300" height="430" rx="14" fill="#B9815E"/>
  <rect x="168" y="108" width="264" height="394" rx="6" fill="#7A4E36"/>
  <path d="M138 98 Q300 40 462 98 L462 108 L138 108 Z" fill="#A06C4C"/>
  <!-- shelves -->
  <rect x="168" y="228" width="264" height="12" fill="#B9815E"/>
  <rect x="168" y="358" width="264" height="12" fill="#B9815E"/>
  <!-- row 1 wrapped books -->
  <g stroke="#3E332F" stroke-opacity=".12">
    <rect x="182" y="140" width="38" height="88" rx="3" fill="#F2B8C2"/>
    <rect x="224" y="128" width="34" height="100" rx="3" fill="#C9B6E4"/>
    <rect x="262" y="148" width="40" height="80" rx="3" fill="#BFD6BE"/>
    <rect x="306" y="134" width="36" height="94" rx="3" fill="#F6C9A8"/>
    <rect x="346" y="144" width="34" height="84" rx="3" fill="#E8A0AE"/>
    <rect x="384" y="132" width="34" height="96" rx="3" fill="#C9B6E4"/>
  </g>
  <!-- row 2 -->
  <g stroke="#3E332F" stroke-opacity=".12">
    <rect x="182" y="266" width="40" height="92" rx="3" fill="#BFD6BE"/>
    <rect x="226" y="276" width="36" height="82" rx="3" fill="#F6C9A8"/>
    <rect x="266" y="262" width="34" height="96" rx="3" fill="#F2B8C2"/>
    <rect x="304" y="272" width="40" height="86" rx="3" fill="#C9B6E4"/>
    <rect x="348" y="264" width="34" height="94" rx="3" fill="#E8A0AE"/>
    <rect x="386" y="278" width="32" height="80" rx="3" fill="#BFD6BE"/>
  </g>
  <!-- row 3 -->
  <g stroke="#3E332F" stroke-opacity=".12">
    <rect x="182" y="396" width="36" height="92" rx="3" fill="#E8A0AE"/>
    <rect x="222" y="404" width="40" height="84" rx="3" fill="#C9B6E4"/>
    <rect x="266" y="392" width="34" height="96" rx="3" fill="#F6C9A8"/>
    <rect x="304" y="402" width="38" height="86" rx="3" fill="#BFD6BE"/>
    <rect x="346" y="394" width="34" height="94" rx="3" fill="#F2B8C2"/>
    <rect x="384" y="406" width="34" height="82" rx="3" fill="#F6C9A8"/>
  </g>
  <!-- ribbons -->
  <g fill="#FFFFFF" opacity=".75">
    <rect x="199" y="140" width="4" height="88"/><rect x="239" y="128" width="4" height="100"/><rect x="280" y="148" width="4" height="80"/>
    <rect x="322" y="134" width="4" height="94"/><rect x="361" y="144" width="4" height="84"/><rect x="399" y="132" width="4" height="96"/>
    <rect x="200" y="266" width="4" height="92"/><rect x="242" y="276" width="4" height="82"/><rect x="281" y="262" width="4" height="96"/>
    <rect x="322" y="272" width="4" height="86"/><rect x="363" y="264" width="4" height="94"/><rect x="400" y="278" width="4" height="80"/>
    <rect x="198" y="396" width="4" height="92"/><rect x="240" y="404" width="4" height="84"/><rect x="281" y="392" width="4" height="96"/>
    <rect x="321" y="402" width="4" height="86"/><rect x="361" y="394" width="4" height="94"/><rect x="399" y="406" width="4" height="82"/>
  </g>
  <!-- little heart seals with numbers -->
  <g font-family="Georgia, serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">
    <circle cx="201" cy="186" r="10" fill="#C0566C"/><text x="201" y="191">1</text>
    <circle cx="282" cy="190" r="10" fill="#C0566C"/><text x="282" y="195">7</text>
    <circle cx="401" cy="182" r="10" fill="#C0566C"/><text x="401" y="187">12</text>
    <circle cx="244" cy="318" r="10" fill="#C0566C"/><text x="244" y="323">3</text>
    <circle cx="365" cy="312" r="10" fill="#C0566C"/><text x="365" y="317">18</text>
    <circle cx="200" cy="444" r="10" fill="#C0566C"/><text x="200" y="449">9</text>
    <circle cx="323" cy="446" r="10" fill="#C0566C"/><text x="323" y="451">24</text>
  </g>
  <!-- feet -->
  <rect x="166" y="520" width="26" height="18" rx="4" fill="#A06C4C"/>
  <rect x="408" y="520" width="26" height="18" rx="4" fill="#A06C4C"/>
  <!-- garland -->
  <path d="M150 104 Q225 150 300 110 Q375 150 450 104" fill="none" stroke="#7FA37E" stroke-width="5"/>
  <g fill="#E8A0AE"><circle cx="190" cy="124" r="6"/><circle cx="260" cy="126" r="6"/><circle cx="340" cy="126" r="6"/><circle cx="410" cy="124" r="6"/></g>
</svg>
